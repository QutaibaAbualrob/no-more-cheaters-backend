# ── No More Cheaters — production reverse proxy (C3) ─────────────────────────
#
# Django's urls.py only serves /media/ and /static/ itself when DEBUG=True (via
# django.conf.urls.static.static). With DEBUG=False — the production default —
# nothing inside Django serves those paths, so every uploaded exam video,
# evidence snapshot/clip, and annotated analysis video 404s. This server block
# is the missing piece: Nginx serves the static + media trees directly from disk
# and proxies everything else to Gunicorn.
#
# Adjust the three ALL-CAPS placeholders for your host, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nomorecheaters
#   sudo ln -s /etc/nginx/sites-available/nomorecheaters /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths below assume the Django settings defaults:
#   STATIC_ROOT = BASE_DIR/staticfiles   (populated by `manage.py collectstatic`)
#   MEDIA_ROOT  = BASE_DIR/media         (written by the upload + AI pipeline)
# where BASE_DIR is the directory containing manage.py. Replace
# /PATH/TO/no-more-cheaters-backend/nomorecheaters with that absolute path.

upstream nomorecheaters_app {
    # Gunicorn binds here (see gunicorn.service). Keep in sync with that unit.
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Exam videos can be large; raise this above the application-level upload
    # cap (see N2) so the request reaches Django and gets a clean 413/validation
    # error instead of an opaque Nginx-level rejection. 0 disables the check.
    client_max_body_size 1024m;

    # ── Static assets (collectstatic output: admin + DRF browsable API) ──────
    location /static/ {
        alias /PATH/TO/no-more-cheaters-backend/nomorecheaters/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Media (uploaded videos + AI evidence: snapshots/, clips/, annotated) ──
    #
    # ⚠ SECURITY: this serves the media tree to anyone who knows (or guesses) a
    # URL. The filenames are UUID-based so they are not enumerable, but these are
    # student exam recordings and face crops — sensitive data. For a hardened
    # deployment, gate downloads behind a Django view using X-Accel-Redirect:
    # mark this block `internal;` and have an authenticated view emit the
    # X-Accel-Redirect header. Left public here to match the current app, which
    # has no media-auth view yet. Tracked as a follow-up to C3.
    location /media/ {
        alias /PATH/TO/no-more-cheaters-backend/nomorecheaters/media/;

        # Let the kernel stream large video files efficiently.
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "private";
    }

    # ── Application (Gunicorn) ───────────────────────────────────────────────
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://nomorecheaters_app;
    }
}
